name: One-shot Games UI design pass

on:
  push:
    branches:
      - feature/ui-redesign-i18n
    paths:
      - .github/workflows/ui-design-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-redesign-i18n
          fetch-depth: 0

      - name: Apply Games page redesign
        run: python scripts/ui_design_pass.py

      - name: Format
        run: cargo fmt

      - name: Test UI-sensitive code
        run: |
          cargo test gui::tests
          cargo test i18n::tests

      - name: Build release
        run: cargo build --release

      - name: Commit design pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gui.rs
          if git diff --cached --quiet; then
            echo "No design changes to commit"
            exit 0
          fi
          git commit -m "ui: redesign games page composition"
          git push origin HEAD:feature/ui-redesign-i18n
