name: UI Phase 1 Games Layout

on:
  push:
    branches:
      - feature/ui-redesign-i18n
    paths:
      - .github/workflows/ui-phase1.yml
      - scripts/ui_phase1_games_layout.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-redesign-i18n
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply Phase 1 patch
        shell: pwsh
        run: python scripts/ui_phase1_games_layout.py

      - name: Format
        run: cargo fmt

      - name: Check
        run: cargo check

      - name: Commit Phase 1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gui.rs
          if git diff --cached --quiet; then
            echo "No UI changes to commit"
            exit 0
          fi
          git commit -m "ui: establish games page wireframe layout"
          git push origin HEAD:feature/ui-redesign-i18n
